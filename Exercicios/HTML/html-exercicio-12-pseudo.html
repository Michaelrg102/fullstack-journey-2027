<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/css-exercicio-08-pseudo.css">
    <title>Pokémon Grid</title>
</head>

<body>
    <header>
        <h1>Minha Pokédex Grid</h1>
    </header>

    <main id="inicio">

        <form action="">
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome">
        </form>

        <section class="pokemon-container">
            <article>
                <h2>Garchomp #445</h2>
                <h3 class="card">Tipo: <span class="pokemon-tipo dragao">Dragão</span> / <span class="pokemon-tipo terrestre">Terrestre</span></h3>
                <img src="https://img.pokemondb.net/artwork/avif/garchomp.avif" alt="Garchomp" width="200">
            </article>

            <article>
                <h2>Lucario #448</h2>
                <h3 class="card">Tipo: <span class="pokemon-tipo lutador">Lutador</span> / <span class="pokemon-tipo aco">Aço</span></h3>
                <img src="https://img.pokemondb.net/artwork/avif/lucario.avif" alt="Lucario" width="200">
            </article>

            <article>
                <h2>Zoroark #571</h2>
                <h3 class="card">Tipo: <span class="pokemon-tipo sombrio">Sombrio</span></h3>
                <img src="https://img.pokemondb.net/artwork/avif/zoroark.avif" alt="Zoroark" width="200">
            </article>

            <article>
                <h2>Sylveon #700</h2>
                <h3 class="card">Tipo: <span class="pokemon-tipo fada">Fada</span></h3>
                <img src="https://img.pokemondb.net/artwork/avif/sylveon.avif" alt="Sylveon" width="200">
            </article>

            <article>
                <h2>Tyranitar #248</h2>
                <h3 class="card">Tipo: <span class="pokemon-tipo pedra">Pedra</span> / <span class="pokemon-tipo sombrio">Sombrio</span></h3>
                <img src="https://img.pokemondb.net/artwork/avif/tyranitar.avif" alt="Tyranitar" width="200">
            </article>

            <article>
                <h2>Greninja #658</h2>
                <h3 class="card">Tipo: <span class="pokemon-tipo agua">Água</span> / <span class="pokemon-tipo sombrio">Sombrio</span></h3>
                <img src="https://img.pokemondb.net/artwork/avif/greninja.avif" alt="Greninja" width="200">
            </article>
        </section>

        <a class="btn-topo" href="#inicio">Voltar ao Início</a>

        <ul class="pokemon-lista">
    <li>Garchomp</li>
    <li>Lucario</li>
    <li>Zoroark</li>
</ul>
    </main>
</body>

</html>
